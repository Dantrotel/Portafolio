    <script>
      // Aplica el tema antes del primer render para evitar el flash de tema incorrecto
      (function () {
        var theme
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        // La barra del navegador sigue el tema elegido, no solo el del sistema (mismos valores que --bg)
        var bar = theme === 'dark' ? '#0E1013' : '#E6E2D8'
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', bar)
          meta.removeAttribute('media')
        })
      })()
    </script>
