name: Deploy React App (Vite) to GitHub Pages

on:
  push:
    branches: [main]  # Solo se ejecuta al hacer push a la rama main
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build
        env:
          # Endpoint de Formspree (Settings > Secrets and variables > Actions > Variables)
          VITE_CONTACT_FORM_URL: ${{ vars.CONTACT_FORM_URL }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Carpeta de salida de Vite
          publish_branch: gh-pages